<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>motus · Session</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page" style="padding-bottom:32px;">

  <!-- Status bar -->
  <div class="status-bar">
    <span style="font-size:15px;font-weight:700;">9:41</span>
    <svg viewBox="0 0 60 16" fill="currentColor" style="width:60px;height:16px;color:#1A1912;opacity:.7;">
      <rect x="0"  y="4" width="6" height="10" rx="1"/>
      <rect x="9"  y="2" width="6" height="12" rx="1"/>
      <rect x="18" y="0" width="6" height="14" rx="1"/>
      <circle cx="34" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M30 6 Q34 3 38 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M29 9 Q34 5 39 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <rect x="48" y="4" width="11" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <rect x="49.5" y="5.5" width="6" height="5" rx="1"/>
      <rect x="59" y="6" width="1.5" height="4" rx="0.7"/>
    </svg>
  </div>

  <!-- Player header -->
  <div class="player-header">
    <a href="today.html" class="player-header__back" aria-label="Zurück">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </a>
    <div class="player-header__center">
      <div class="player-header__label" id="exerciseLabel">Übung 1 / 6</div>
      <div class="player-header__title" id="sessionTitle">Push · Upper Body</div>
    </div>
    <div class="player-header__flag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
        <line x1="4" y1="22" x2="4" y2="15"/>
      </svg>
    </div>
  </div>

  <!-- Progress dots -->
  <div class="progress-dots" id="progressDots"></div>

  <!-- Exercise cover -->
  <div class="exercise-cover">
    <span class="exercise-cover__badge" id="coverBadge">Sätze</span>
    <span class="exercise-cover__counter" id="coverCounter">1 / 6</span>
    <div class="exercise-cover__content">
      <div class="exercise-cover__eyebrow" id="coverEyebrow">Push · Upper Body</div>
      <div class="exercise-cover__name" id="coverName">Bench Press</div>
      <div class="exercise-cover__detail" id="coverDetail">4 × 8 · 72,5 kg</div>
    </div>
    <span class="exercise-cover__symbol">+</span>
  </div>

  <!-- Controls -->
  <div class="player-controls">
    <div class="player-controls__timer">
      <span id="elapsed">0:00</span>
      <span id="totalTime">5:36</span>
    </div>
    <div class="player-controls__track">
      <div class="player-controls__track-fill" id="trackFill" style="width:0%"></div>
    </div>
    <div class="player-controls__buttons">
      <button class="player-controls__skip" id="btnPrev" aria-label="Vorherige">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="19 20 9 12 19 4 19 20"/>
          <line x1="5" y1="19" x2="5" y2="5"/>
        </svg>
      </button>
      <button class="player-controls__play" id="btnPlay" aria-label="Play/Pause">
        <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
          <rect x="6" y="4" width="4" height="16"/>
          <rect x="14" y="4" width="4" height="16"/>
        </svg>
      </button>
      <button class="player-controls__skip" id="btnNext" aria-label="Nächste">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 4 15 12 5 20 5 4"/>
          <line x1="19" y1="5" x2="19" y2="19"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Up next list -->
  <div class="up-next">
    <div class="up-next__header">Als nächstes</div>
    <div id="upNextList"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
<script src="js/player.js"></script>
</body>
</html>
