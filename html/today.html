<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>motus · Today</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <!-- Header -->
  <div class="today-header">
    <div class="today-header__top">
      <span class="today-header__date" id="todayDate">Donnerstag · 14 Mai</span>
      <button class="today-header__bell" aria-label="Benachrichtigungen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 01-3.46 0"/>
        </svg>
      </button>
    </div>
    <h1 class="today-header__greeting">
      Guten Morgen,<br>
      <span class="clay" id="userName">Lia.</span>
    </h1>
  </div>

  <!-- Week strip -->
  <div class="week-strip" id="weekStrip"></div>

  <!-- Hero session card -->
  <div class="hero-card" id="heroCard">
    <div class="hero-card__eyebrow">Heute · Strength A</div>
    <h2 class="hero-card__title">Push · Upper Body</h2>
    <div class="hero-card__meta">
      <span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        42 min
      </span>
      <span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        6 lifts
      </span>
      <span>◎ Mittel</span>
    </div>
    <div class="hero-card__actions">
      <a href="player.html?session=push-upper" class="btn btn--clay btn--md">
        Session öffnen
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
      <button class="btn btn--outline btn--md" onclick="showToast('Session verschoben')">Verschieben</button>
    </div>
    <div class="hero-card__symbol">+</div>
  </div>

  <!-- Stat tiles -->
  <div class="stat-tiles">
    <!-- Steps -->
    <div class="stat-tile">
      <div class="stat-tile__label">
        <span>Heute</span>
        <span class="stat-tile__delta">+12%</span>
      </div>
      <div class="stat-tile__value">8,420</div>
      <div class="stat-tile__sub">Schritte · Ziel 7,500</div>
      <div class="stat-tile__bar">
        <div class="stat-tile__bar-fill" style="width:112%;max-width:100%"></div>
      </div>
    </div>
    <!-- Sessions this week -->
    <div class="stat-tile stat-tile--dark">
      <div class="stat-tile__label">Diese Woche</div>
      <div class="stat-tile__fraction">3<span class="denom">/5</span></div>
      <div class="stat-tile__sub">Sessions on plan</div>
      <div class="stat-tile__bar">
        <div class="stat-tile__bar-fill" style="width:60%"></div>
      </div>
    </div>
  </div>

  <!-- Progress section -->
  <div class="section-header">
    <h2>Dein Fortschritt</h2>
    <a href="#">Alles</a>
  </div>

  <div class="progress-grid">
    <div class="progress-tile">
      <div class="ring">
        <svg viewBox="0 0 48 48">
          <circle class="ring__track" cx="24" cy="24" r="20"/>
          <circle class="ring__fill" cx="24" cy="24" r="20"
            stroke-dasharray="125.66"
            stroke-dashoffset="31.4"/>
        </svg>
        <span class="ring__icon">→</span>
      </div>
      <div class="progress-tile__info">
        <div class="progress-tile__label">Brust</div>
        <div class="progress-tile__value">75%</div>
      </div>
    </div>

    <div class="progress-tile">
      <div class="ring">
        <svg viewBox="0 0 48 48">
          <circle class="ring__track" cx="24" cy="24" r="20"/>
          <circle class="ring__fill" cx="24" cy="24" r="20"
            stroke-dasharray="125.66"
            stroke-dashoffset="47.75"
            style="stroke:#8B8278"/>
        </svg>
        <span class="ring__icon">→</span>
      </div>
      <div class="progress-tile__info">
        <div class="progress-tile__label">Rücken</div>
        <div class="progress-tile__value" style="color:#8B8278">62%</div>
      </div>
    </div>

    <div class="progress-tile">
      <div class="ring">
        <svg viewBox="0 0 48 48">
          <circle class="ring__track" cx="24" cy="24" r="20"/>
          <circle class="ring__fill" cx="24" cy="24" r="20"
            stroke-dasharray="125.66"
            stroke-dashoffset="65.34"
            style="stroke:#B5AFA8"/>
        </svg>
        <span class="ring__icon">→</span>
      </div>
      <div class="progress-tile__info">
        <div class="progress-tile__label">Beine</div>
        <div class="progress-tile__value" style="color:#B5AFA8">48%</div>
      </div>
    </div>

    <div class="progress-tile">
      <div class="ring">
        <svg viewBox="0 0 48 48">
          <circle class="ring__track" cx="24" cy="24" r="20"/>
          <circle class="ring__fill" cx="24" cy="24" r="20"
            stroke-dasharray="125.66"
            stroke-dashoffset="12.57"/>
        </svg>
        <span class="ring__icon">→</span>
      </div>
      <div class="progress-tile__info">
        <div class="progress-tile__label">Core</div>
        <div class="progress-tile__value">90%</div>
      </div>
    </div>
  </div>

</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <a href="today.html" class="bottom-nav__item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    Today
  </a>
  <a href="library.html" class="bottom-nav__item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
    Plan
  </a>
  <a href="library.html" class="bottom-nav__fab" aria-label="Neu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </a>
  <a href="activity.html" class="bottom-nav__item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
    </svg>
    Activity
  </a>
  <a href="profile.html" class="bottom-nav__item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </svg>
    You
  </a>
</nav>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
<script src="js/today.js"></script>
</body>
</html>
