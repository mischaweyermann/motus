<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>motus · Fertig!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="complete-page">

  <!-- Success ring -->
  <div class="success-ring">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>

  <!-- Labels -->
  <div class="complete-label">Session Abgeschlossen</div>
  <h1 class="complete-title">
    Stark. Das war<br>
    <span class="clay" id="sessionNameDisplay">Push · Upper Body.</span>
  </h1>

  <!-- Stats -->
  <div class="complete-stats">
    <div class="complete-stat">
      <div class="complete-stat__label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        Zeit
      </div>
      <div class="complete-stat__value" id="statTime">42'</div>
    </div>
    <div class="complete-stat">
      <div class="complete-stat__label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        Kcal
      </div>
      <div class="complete-stat__value" id="statKcal">~320</div>
    </div>
    <div class="complete-stat">
      <div class="complete-stat__label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        Übungen
      </div>
      <div class="complete-stat__value" id="statExercises">6</div>
    </div>
  </div>

  <!-- Actions -->
  <div class="complete-actions">
    <a href="today.html" class="btn btn--ink btn--lg">Fertig</a>
    <a href="#" class="note-link">Notiz hinzufügen</a>
  </div>

</div>

<script src="js/app.js"></script>
<script>
  // Load session name from storage
  const lastSession = JSON.parse(sessionStorage.getItem('motus_last_session') || '{}');
  if (lastSession.name) {
    document.getElementById('sessionNameDisplay').textContent = lastSession.name + '.';
    if (lastSession.duration) document.getElementById('statTime').textContent = lastSession.duration + "'";
    if (lastSession.kcal) document.getElementById('statKcal').textContent = '~' + lastSession.kcal;
    if (lastSession.exercises) document.getElementById('statExercises').textContent = lastSession.exercises;
  }
</script>
</body>
</html>
