<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>motus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="onboarding">
  <!-- Dark hero panel -->
  <div class="onboarding__hero">
    <div class="onboarding__blob onboarding__blob--1"></div>
    <div class="onboarding__blob onboarding__blob--2"></div>

    <!-- Logo -->
    <div class="onboarding__logo">
      <svg class="onboarding__logo-mark" viewBox="0 0 32 32" fill="none">
        <circle cx="22" cy="6" r="4" fill="currentColor"/>
        <path d="M20 10L9 25" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M20 10L28 17" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M9 25L5 31" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M9 25L14 30" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      <span class="onboarding__logo-text">motus</span>
    </div>

    <!-- Headline -->
    <div class="onboarding__eyebrow">Latin · For Movement</div>
    <h1 class="onboarding__headline">
      Move every<br>day.<br>
      <span class="clay">One plan,<br>every sport.</span>
    </h1>
  </div>

  <!-- Bottom sheet -->
  <div class="onboarding__sheet">
    <p class="onboarding__body">
      Tennis am Mittwoch, Gym am Donnerstag, lange
      Ausfahrt am Wochenende. Motus hält alles
      zusammen — Plan, Sessions, Recovery.
    </p>
    <a href="today.html" class="btn btn--ink btn--lg">
      Loslegen
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
    <a href="today.html" class="onboarding__link">
      Schon dabei? <strong>Anmelden</strong>
    </a>
  </div>
</div>

</body>
</html>
