<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>motus · Session</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page" style="padding-bottom:32px;">

  <!-- Status bar -->
  <div class="status-bar">
    <div class="status-bar__time">9:41</div>
    <div class="status-bar__icons">
      <svg width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill="#1F1F1F"/><rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill="#1F1F1F"/><rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill="#1F1F1F"/><rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill="#1F1F1F"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill="#1F1F1F"/><path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill="#1F1F1F"/><circle cx="8.5" cy="10.5" r="1.5" fill="#1F1F1F"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="#1F1F1F" stroke-opacity="0.35" fill="none"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#1F1F1F"/><path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill="#1F1F1F" fill-opacity="0.4"/></svg>
    </div>
  </div>

  <!-- Workout header -->
  <div class="workout-header">
    <a href="today.html" class="workout-header__btn" aria-label="Zurück" style="transform:scaleX(-1)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1F1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
    </a>
    <span class="workout-header__label">Session</span>
    <button class="workout-header__btn" aria-label="Einstellungen">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1F1F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
    </button>
  </div>

  <!-- Title area -->
  <div class="workout-title-area">
    <div class="workout-title-area__eyebrow" id="sessionEyebrow">Push · Upper Body</div>
    <div class="workout-title-area__title" id="exerciseName">Bench Press</div>
    <div class="workout-title-area__sub" id="exerciseMeta">Übung 2 von 6 · 60s Pause</div>
  </div>

  <!-- Timer hero card -->
  <div class="timer-card">
    <!-- Ring SVG (r=42, size=104, stroke=10) circ=263.9 -->
    <div class="ring">
      <svg width="104" height="104" viewBox="0 0 104 104" style="transform:rotate(-90deg);">
        <circle cx="52" cy="52" r="42" stroke="rgba(242,237,227,0.14)" stroke-width="10" fill="none"/>
        <circle cx="52" cy="52" r="42" stroke="#C24B2E" stroke-width="10" fill="none"
          stroke-linecap="round"
          stroke-dasharray="263.9"
          stroke-dashoffset="100.3"
          id="timerRing"/>
      </svg>
      <div class="ring__center">
        <div class="timer-card__ring-label">
          <div class="timer-card__time" id="timerDisplay">0:37</div>
          <div class="timer-card__time-sub">von 60s</div>
        </div>
      </div>
    </div>

    <div class="timer-card__info">
      <div class="timer-card__cur-label">Aktueller Satz</div>
      <div class="timer-card__cur-value" id="currentSet">8 × 72.5 kg</div>
      <div class="timer-card__actions">
        <button class="timer-card__play-btn" id="btnPlayPause" onclick="toggleTimer()">
          <svg id="iconPlay" width="14" height="14" viewBox="0 0 24 24" fill="#FAF7F1" stroke="none"><path d="M7 5l12 7-12 7z"/></svg>
          <svg id="iconPause" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FAF7F1" stroke-width="2" style="display:none;"><rect x="7" y="5" width="3" height="14" rx="1"/><rect x="14" y="5" width="3" height="14" rx="1"/></svg>
          <span id="btnLabel">Weiter</span>
        </button>
        <button class="timer-card__extra-btn" onclick="addTime()">+10s</button>
      </div>
    </div>
  </div>

  <!-- Sets -->
  <div class="sets-section">
    <div class="sets-section__head">
      <div class="sets-section__title">Sätze</div>
      <span class="sets-section__sub" id="setsProgress">2 von 4 erledigt</span>
    </div>
    <div id="setsList"></div>
  </div>

  <!-- Next exercise -->
  <div class="next-exercise">
    <div class="next-exercise__label">Nächste Übung</div>
    <div class="list-row" id="nextExerciseRow">
      <div class="list-row__icon list-row__icon--cream300">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F1F1F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h4M14 11h4M10 8v6M14 8v6M3 11h3M18 11h3"/></svg>
      </div>
      <div class="list-row__content">
        <div class="list-row__title" id="nextExName">Incline DB Press</div>
        <div class="list-row__sub" id="nextExDetail">3 × 10 · 22.5 kg</div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8C8270" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>
  </div>

  <!-- Finish button -->
  <div style="padding: 20px;">
    <a href="complete.html" class="btn btn--ink btn--lg">Session abschließen</a>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
<script src="js/workout.js"></script>
</body>
</html>
